name: Recuperação permanente e consultas por empresa
on:
  push:
    branches: [recuperacao-consultas-20261011]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Preservar biometria, certificado, impressão e agente
        run: git diff --exit-code 997d35b50066bbd2080ba9bfa5b8e255196ae425 HEAD -- native backend/src/services backend/src/db/jpged.js frontend/EntregaEPI/assets/biometria.js frontend/EntregaEPI/assets/jpged.js frontend/EntregaEPI/assets/operations.js frontend/EntregaEPI/assets/ficha.js
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - run: npm ci --prefix backend --no-audit --no-fund
      - run: python3 scripts/test-epi-report.py
      - run: node --test backend/test/*.test.js tests/frontend.test.cjs tests/list-consistency.test.cjs
      - run: npm ci --prefix tests --no-audit --no-fund
      - run: npm run install-browser --prefix tests
      - run: node tests/epi-catalog-browser.cjs
      - run: node tests/frontend-startup-browser.cjs
      - run: node tests/auto-update-browser.cjs
      - run: node tests/biometria-login-browser.cjs
      - run: node tests/jpged-browser.cjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: recuperacao-consultas-${{ github.sha }}
          path: tests/output/
          retention-days: 14
