name: Desempenho EntregaEPI
on:
  push:
    branches: [desempenho-20261014]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - run: npm ci --prefix backend --no-audit --no-fund
      - run: npm ci --prefix tests --no-audit --no-fund
      - name: Preparar comparação com a versão publicada
        run: |
          mkdir -p tests/baseline
          git show 612628c3e5bbe1c8e242202d79a9d0edcf31c3ef:frontend/EntregaEPI/assets/app.js > tests/baseline/app.js
          git show 612628c3e5bbe1c8e242202d79a9d0edcf31c3ef:frontend/EntregaEPI/index.html > tests/baseline/index.html
          echo "JP_TEST_CHROMIUM=$(command -v google-chrome)" >> "$GITHUB_ENV"
      - run: node --test backend/test/epi-report*.test.js backend/test/api.test.js backend/test/auth.test.js tests/frontend.test.cjs
      - run: node tests/performance-browser.cjs
      - run: node tests/frontend-startup-browser.cjs
      - run: node tests/epi-catalog-browser.cjs
      - run: node tests/visual-navigation-browser.cjs
      - run: node tests/auto-update-browser.cjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: desempenho-entregaepi
          path: tests/output/
          if-no-files-found: error
          retention-days: 30
