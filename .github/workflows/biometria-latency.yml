name: Agilidade da captura biometrica
on:
  push:
    branches: [captura-agil-20261016]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Confirmar preservacao do leitor, instalador e servidor
        run: git diff --exit-code 2880d1baff1b81284e22f9d59e6bffe76b6f16bc -- native backend frontend/EntregaEPI/index.html
      - run: npm ci --prefix backend --no-audit --no-fund
      - run: npm ci --prefix tests --no-audit --no-fund
      - run: sudo apt-get update && sudo apt-get install --no-install-recommends -y poppler-utils
      - run: echo "JP_TEST_CHROMIUM=$(command -v google-chrome)" >> "$GITHUB_ENV"
      - run: node --test tests/biometria.test.cjs backend/test/biometria-login.test.js backend/test/ficha-capture-api.test.js
      - run: node tests/biometria-latency.cjs
      - run: node tests/biometria-capture-browser.cjs
      - if: ${{ !cancelled() }}
        run: node tests/operations-browser.cjs
      - if: ${{ !cancelled() }}
        run: node tests/frontend-startup-browser.cjs
      - if: ${{ !cancelled() }}
        run: python3 -m unittest discover -s infra -p test_frontend_release.py
      - if: ${{ !cancelled() }}
        run: node tests/cache-release-browser.cjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: captura-agil-testes
          path: tests/output/
          retention-days: 30
