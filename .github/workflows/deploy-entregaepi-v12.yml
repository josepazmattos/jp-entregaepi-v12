name: Deploy JP EntregaEPI V12

on:
  workflow_dispatch:
    inputs:
      app_prefix:
        description: "Caminho de publicação"
        required: true
        default: "EntregaEPI-v12"
        type: choice
        options:
          - EntregaEPI-v12
          - EntregaEPI-v12-teste
          - EntregaEPI
      target_ref:
        description: "Branch/tag/commit com o código a publicar"
        required: true
        default: "v12-teste"
      run_smoke_tests:
        description: "Executar testes finais"
        required: true
        default: true
        type: boolean

  push:
    branches:
      - main
      - v12-teste
    paths:
      - "backend/**"
      - "frontend/**"
      - "infra/**"
      - ".github/workflows/deploy-entregaepi-v12.yml"

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: sa-east-1
  S3_BUCKET: pagina-conteudo-cloudfront
  CLOUDFRONT_DIST_ID: E2Q4EB4LP1LFXF
  LAMBDA_NAME: jp-entregaepi-v12-api
  LAMBDA_ROLE_NAME: jp-entregaepi-v12-lambda-role
  API_NAME: jp-entregaepi-v12-http-api
  TABLE_NAME: jp-entregaepi-v12
  USER_POOL_ID: sa-east-1_3FNCoTvr0
  CLIENT_ID: 2q2inha617oeer4vb0m0hjoja0

jobs:
  deploy:
    name: Deploy EntregaEPI V12
    runs-on: ubuntu-latest

    steps:
      - name: Definir alvo do deploy
        id: target
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            APP_PREFIX="${{ github.event.inputs.app_prefix }}"
            TARGET_REF="${{ github.event.inputs.target_ref }}"
            RUN_SMOKE="${{ github.event.inputs.run_smoke_tests }}"
          else
            TARGET_REF="${GITHUB_REF_NAME}"
            RUN_SMOKE="true"
            if [ "${GITHUB_REF_NAME}" = "main" ]; then
              APP_PREFIX="EntregaEPI"
            else
              APP_PREFIX="EntregaEPI-v12"
            fi
          fi

          echo "app_prefix=$APP_PREFIX" >> "$GITHUB_OUTPUT"
          echo "target_ref=$TARGET_REF" >> "$GITHUB_OUTPUT"
          echo "run_smoke_tests=$RUN_SMOKE" >> "$GITHUB_OUTPUT"

          echo "Deploy alvo: $APP_PREFIX"
          echo "Ref alvo: $TARGET_REF"

      - name: Baixar código alvo
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.target.outputs.target_ref }}

      - name: Configurar AWS via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}

      - name: Conferir estrutura obrigatória
        run: |
          test -f backend/package.json
          test -f backend/src/lambda.js
          test -f backend/src/db/store.js
          test -f frontend/EntregaEPI/index.html
          test -f frontend/EntregaEPI/assets/app.js
          test -f frontend/EntregaEPI/assets/styles.css

      - name: Garantir tabela DynamoDB
        run: |
          if ! aws dynamodb describe-table --table-name "$TABLE_NAME" --region "$AWS_REGION" >/dev/null 2>&1; then
            aws dynamodb create-table \
              --table-name "$TABLE_NAME" \
              --attribute-definitions AttributeName=pk,AttributeType=S AttributeName=sk,AttributeType=S \
              --key-schema AttributeName=pk,KeyType=HASH AttributeName=sk,KeyType=RANGE \
              --billing-mode PAY_PER_REQUEST \
              --region "$AWS_REGION"
            aws dynamodb wait table-exists --table-name "$TABLE_NAME" --region "$AWS_REGION"
          fi

      - name: Instalar dependências e validar backend
        working-directory: backend
        run: |
          npm install --omit=dev --no-audit --no-fund
          npm test

      - name: Empacotar Lambda
        run: |
          rm -rf .deploy
          mkdir -p .deploy/backend-package
          cp -a backend/. .deploy/backend-package/
          rm -rf .deploy/backend-package/node_modules
          rm -f .deploy/backend-package/package-lock.json
          cd .deploy/backend-package
          npm install --omit=dev --no-audit --no-fund
          zip -qr ../lambda.zip .

      - name: Criar ou atualizar Lambda
        run: |
          ROLE_ARN="arn:aws:iam::$(aws sts get-caller-identity --query Account --output text):role/${LAMBDA_ROLE_NAME}"
          if aws lambda get-function --function-name "$LAMBDA_NAME" --region "$AWS_REGION" >/dev/null 2>&1; then
            aws lambda update-function-code \
              --function-name "$LAMBDA_NAME" \
              --zip-file fileb://.deploy/lambda.zip \
              --region "$AWS_REGION"
            aws lambda wait function-updated --function-name "$LAMBDA_NAME" --region "$AWS_REGION"
          else
            aws lambda create-function \
              --function-name "$LAMBDA_NAME" \
              --runtime nodejs20.x \
              --role "$ROLE_ARN" \
              --handler src/lambda.handler \
              --zip-file fileb://.deploy/lambda.zip \
              --timeout 30 \
              --memory-size 256 \
              --region "$AWS_REGION"
            aws lambda wait function-active --function-name "$LAMBDA_NAME" --region "$AWS_REGION"
          fi

      - name: Configurar variáveis da Lambda
        run: |
          aws lambda update-function-configuration \
            --function-name "$LAMBDA_NAME" \
            --region "$AWS_REGION" \
            --environment "Variables={TABLE_NAME=$TABLE_NAME,APP_VERSION=12.7.0,DATA_MODE=dynamodb}"
          aws lambda wait function-updated --function-name "$LAMBDA_NAME" --region "$AWS_REGION"

      - name: Localizar API Gateway
        id: api
        run: |
          API_ID=$(aws apigatewayv2 get-apis \
            --region "$AWS_REGION" \
            --query "Items[?Name=='$API_NAME'].ApiId | [0]" \
            --output text)
          if [ -z "$API_ID" ] || [ "$API_ID" = "None" ]; then
            echo "API Gateway não encontrada: $API_NAME"
            exit 1
          fi
          API_ENDPOINT="https://${API_ID}.execute-api.${AWS_REGION}.amazonaws.com"
          echo "api_endpoint=$API_ENDPOINT" >> "$GITHUB_OUTPUT"
          echo "API_ENDPOINT=$API_ENDPOINT"

      - name: Preparar config e prefixo do frontend
        run: |
          APP_PREFIX="${{ steps.target.outputs.app_prefix }}"
          cat > frontend/EntregaEPI/config.js <<EOF
          window.JP_CONFIG = {
            version: "12.7.0-funcional",
            appBasePath: "/${APP_PREFIX}/",
            apiBaseUrl: "${{ steps.api.outputs.api_endpoint }}",
            cognitoRegion: "${AWS_REGION}",
            userPoolId: "${USER_POOL_ID}",
            clientId: "${CLIENT_ID}",
            ambiente: "producao"
          };
          EOF
          if grep -q "__APP_PREFIX__" frontend/EntregaEPI/index.html; then
            sed -i "s#__APP_PREFIX__#${APP_PREFIX}#g" frontend/EntregaEPI/index.html
          fi

      - name: Backup antes de publicar em produção
        if: ${{ steps.target.outputs.app_prefix == 'EntregaEPI' }}
        run: |
          BACKUP_PREFIX="EntregaEPI-backup-actions-$(date +%Y%m%d-%H%M%S)"
          aws s3 sync "s3://${S3_BUCKET}/EntregaEPI/" "s3://${S3_BUCKET}/${BACKUP_PREFIX}/" || true
          aws s3 cp "s3://${S3_BUCKET}/EntregaEPI" "s3://${S3_BUCKET}/${BACKUP_PREFIX}/ROOT_EntregaEPI.html" || true
          aws s3 cp "s3://${S3_BUCKET}/EntregaEPI/" "s3://${S3_BUCKET}/${BACKUP_PREFIX}/ROOT_EntregaEPI_SLASH.html" || true
          echo "Backup criado em s3://${S3_BUCKET}/${BACKUP_PREFIX}/"

      - name: Publicar frontend no S3
        run: |
          APP_PREFIX="${{ steps.target.outputs.app_prefix }}"
          aws s3 sync frontend/EntregaEPI/ "s3://${S3_BUCKET}/${APP_PREFIX}/" \
            --delete \
            --cache-control "no-store, no-cache, must-revalidate"
          aws s3api put-object \
            --bucket "$S3_BUCKET" \
            --key "$APP_PREFIX" \
            --body frontend/EntregaEPI/index.html \
            --content-type "text/html; charset=utf-8" \
            --cache-control "no-store, no-cache, must-revalidate"
          aws s3api put-object \
            --bucket "$S3_BUCKET" \
            --key "$APP_PREFIX/" \
            --body frontend/EntregaEPI/index.html \
            --content-type "text/html; charset=utf-8" \
            --cache-control "no-store, no-cache, must-revalidate"

      - name: Invalidar CloudFront
        run: |
          APP_PREFIX="${{ steps.target.outputs.app_prefix }}"
          aws cloudfront create-invalidation \
            --distribution-id "$CLOUDFRONT_DIST_ID" \
            --paths "/${APP_PREFIX}" "/${APP_PREFIX}/" "/${APP_PREFIX}/*"

      - name: Testes finais
        if: ${{ steps.target.outputs.run_smoke_tests == 'true' }}
        run: |
          curl -fsS "${{ steps.api.outputs.api_endpoint }}/health"
          echo
          curl -fsS "${{ steps.api.outputs.api_endpoint }}/api/caepi/365"
          echo
          APP_PREFIX="${{ steps.target.outputs.app_prefix }}"
          curl -s "https://www.jptreinamentos.com.br/${APP_PREFIX}?v=$(date +%s)" | grep -E "Dashboard|Entrega de EPI|JP Segurança do Trabalho" | head

      - name: Resultado
        run: |
          APP_PREFIX="${{ steps.target.outputs.app_prefix }}"
          echo "Deploy concluído: https://www.jptreinamentos.com.br/${APP_PREFIX}?v=127"
          echo "API: ${{ steps.api.outputs.api_endpoint }}"
