name: Testar e publicar JP EntregaEPI

on:
  push:
    branches:
      - main
      - v12-teste
      - install-v12-7-recovery-20261006
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: jp-entregaepi-${{ github.ref }}
  cancel-in-progress: false

env:
  AWS_REGION: sa-east-1
  AWS_DEFAULT_REGION: sa-east-1
  AWS_PAGER: ""
  AWS_CLI_AUTO_PROMPT: "off"

jobs:
  test:
    name: Validar código, ficha e navegador
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      tested_sha: ${{ steps.commit.outputs.sha }}
    steps:
      - name: Baixar o commit solicitado
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Conferir contexto e commit
        id: commit
        shell: bash
        run: |
          set -euo pipefail
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ] && [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "A execução manual é permitida somente na branch main."
            exit 1
          fi
          ACTUAL_SHA="$(git rev-parse HEAD)"
          test "$ACTUAL_SHA" = "$GITHUB_SHA"
          echo "sha=$ACTUAL_SHA" >> "$GITHUB_OUTPUT"
      - name: Preparar Node.js 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            tests/package-lock.json
      - name: Instalar dependências do backend pelo lockfile
        run: npm ci --prefix backend --no-audit --no-fund
      - name: Preparar a cópia oficial CAEPI fixada por hash
        run: python3 infra/fetch_ca_snapshot.py
      - name: Testar backend com dados sintéticos
        run: npm test --prefix backend
      - name: Validar automação de implantação
        run: |
          python3 -m py_compile infra/deploy.py infra/fetch_ca_snapshot.py infra/test_deploy.py infra/test_ca_snapshot.py
          python3 -m unittest discover -s infra -p 'test_*.py' -v
          bash -n infra/instalar-v12-7-producao-funcional.sh
      - name: Instalar testes de navegador pelo lockfile
        run: npm ci --prefix tests --no-audit --no-fund
      - name: Preparar Chromium
        run: npm --prefix tests run install-browser
      - name: Testar dashboard, login e ficha no navegador
        run: npm --prefix tests test
      - name: Guardar somente evidências sintéticas
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: verificacao-sintetica-${{ github.sha }}
          path: tests/output/
          if-no-files-found: ignore
          retention-days: 14

  deploy:
    name: Publicar a versão aprovada na main
    needs: test
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      id-token: write
    env:
      JP_CI_PASSED_SHA: ${{ needs.test.outputs.tested_sha }}
    steps:
      - name: Baixar exatamente o commit testado
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.test.outputs.tested_sha }}
          persist-credentials: false
      - name: Preparar Node.js 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Preparar dependências de produção
        run: npm ci --prefix backend --omit=dev --no-audit --no-fund
      - name: Preparar a mesma cópia oficial CAEPI testada
        run: python3 infra/fetch_ca_snapshot.py
      - name: Autenticar na conta AWS verificada
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4
        with:
          role-to-assume: arn:aws:iam::003020057405:role/jp-entregaepi-v12-github-actions-role
          role-session-name: entregaepi-${{ github.run_id }}-${{ github.run_attempt }}
          aws-region: sa-east-1
          role-duration-seconds: 3600
          retry-max-attempts: 3
      - name: Publicar com backup e restauração automática
        run: python3 infra/deploy.py
      - name: Guardar somente o relatório público da implantação
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: resultado-implantacao-${{ github.sha }}
          path: .deploy/public-report.json
          if-no-files-found: ignore
          retention-days: 30
